name: Bug report
description: Something in UniFetcher isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't paste cookies, passwords or private links here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error log
      description: |
        Copy it from UniFetcher: tap the failed download and choose "Copy report",
        or after a crash tap the copy button on the crash screen. Remove anything private first.
      render: text
  - type: input
    id: version
    attributes:
      label: UniFetcher version
      description: Settings → About → Version (tap it to copy device info)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: e.g. Samsung Galaxy A55, Android 15
