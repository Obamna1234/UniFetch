# Builds a test (debug) APK on every push and attaches it to the run as a download.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # GitHub's own cache only (the default "enhanced" mode uses an outside service)
          cache-provider: basic

      # Optional: if the signing key is set up in GitHub Secrets, test builds use it too, so a
      # newer test build installs over an older one. Without it, each test build gets a new key.
      - name: Load signing key (if set up)
        env:
          KEYSTORE_BASE64: ${{ secrets.UNIFETCH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/unifetch.jks"
            echo "UNIFETCH_KEYSTORE_FILE=$RUNNER_TEMP/unifetch.jks" >> "$GITHUB_ENV"
            echo "Signing key found: test build will use it."
          else
            echo "No signing key in GitHub Secrets yet: using a temporary debug key."
          fi

      - name: Build debug APKs
        env:
          UNIFETCH_KEYSTORE_PASSWORD: ${{ secrets.UNIFETCH_KEYSTORE_PASSWORD }}
          UNIFETCH_KEY_ALIAS: ${{ secrets.UNIFETCH_KEY_ALIAS }}
          UNIFETCH_KEY_PASSWORD: ${{ secrets.UNIFETCH_KEY_PASSWORD }}
        run: ./gradlew assembleGenericDebug --stacktrace

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/unifetch.jks"

      - name: Upload arm64 APK (most phones, including Samsung Galaxy A55)
        uses: actions/upload-artifact@v7
        with:
          # archive: false uploads the .apk itself (no zip), named after the file
          path: app/build/outputs/apk/generic/debug/*-arm64-v8a.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload universal APK (any Android device)
        uses: actions/upload-artifact@v7
        with:
          # archive: false uploads the .apk itself (no zip), named after the file
          path: app/build/outputs/apk/generic/debug/*-universal.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
