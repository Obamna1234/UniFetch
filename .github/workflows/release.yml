# Builds signed release APKs when a version tag (e.g. v1.0.0) is pushed, and publishes them
# on the GitHub Releases page with automatically written release notes.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets are set up
        env:
          KEYSTORE_BASE64: ${{ secrets.UNIFETCH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.UNIFETCH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UNIFETCH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UNIFETCH_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing UNIFETCH_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing UNIFETCH_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing UNIFETCH_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing UNIFETCH_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Secrets:$missing. See HOW_TO.md, 'Set up the signing key'."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.UNIFETCH_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/unifetch.jks"
          echo "UNIFETCH_KEYSTORE_FILE=$RUNNER_TEMP/unifetch.jks" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        env:
          UNIFETCH_KEYSTORE_PASSWORD: ${{ secrets.UNIFETCH_KEYSTORE_PASSWORD }}
          UNIFETCH_KEY_ALIAS: ${{ secrets.UNIFETCH_KEY_ALIAS }}
          UNIFETCH_KEY_PASSWORD: ${{ secrets.UNIFETCH_KEY_PASSWORD }}
        run: ./gradlew assembleGenericRelease -PappVersion="$GITHUB_REF_NAME" --stacktrace

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/unifetch.jks"

      - name: Check the APKs are signed
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/generic/release/*.apk; do
            "$apksigner" verify "$apk"
            echo "Signed OK: $(basename "$apk")"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/generic/release/*-arm64-v8a.apk
            app/build/outputs/apk/generic/release/*-armeabi-v7a.apk
            app/build/outputs/apk/generic/release/*-x86_64.apk
            app/build/outputs/apk/generic/release/*-universal.apk
